[project]
name = "incident-copilot"
version = "1.0.0"
description = "Incident & Ticket Enrichment Copilot: MCP servers + MCP client + document RAG + GUI"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "mcp>=1.12,<2",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
llm = ["anthropic>=2.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
pythonpath = [".", "apps/backend", "mcp-servers/alarm-management", "mcp-servers/ticketing"]
testpaths = ["tests", "rag/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: end-to-end tests that start every service on real ports",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["apps/backend/copilot", "mcp-servers", "connectors", "rag", "common", "simulators"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = false
skip_covered = false

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = [".venv", "rag/index"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF"]
ignore = ["S101", "S104", "S311", "B008", "RUF001", "RUF002", "RUF003", "SIM108", "RUF012", "E501", "RUF007", "C416"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"rag/tests/**" = ["S105", "S106"]
"scripts/**" = ["S105", "S106"]
"simulators/**" = ["S105", "S107"]
"*/config.py" = ["S105"]
"mcp-servers/**/server.py" = ["S105"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
mypy_path = ["apps/backend", "mcp-servers/alarm-management", "mcp-servers/ticketing"]
explicit_package_bases = true
exclude = ["tests/", "rag/tests/", ".venv/"]

[tool.ruff.lint.isort]
known-first-party = ["alarm_mcp", "ticketing_mcp", "copilot", "common", "connectors", "rag", "simulators", "tests"]

[tool.ruff.format]
quote-style = "double"
