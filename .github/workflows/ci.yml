name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: .:apps/backend:mcp-servers/alarm-management:mcp-servers/ticketing

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint (incl. bandit-style security rules)
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy apps/backend/copilot mcp-servers/alarm-management/alarm_mcp mcp-servers/ticketing/ticketing_mcp connectors common rag simulators

  tests:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, mcp, rag, integration, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Run suite
        run: |
          case "${{ matrix.suite }}" in
            unit)        pytest tests/unit ;;
            mcp)         pytest tests/integration/test_mcp_servers.py tests/integration/test_mcp_client.py ;;
            rag)         pytest rag/tests ;;
            integration) pytest tests/integration ;;
            e2e)         pytest tests/e2e ;;
          esac

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        with: { name: coverage-xml, path: coverage.xml }

  security:
    name: Dependency audit + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Docker build + compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose build
      - name: Smoke test the stack
        run: |
          docker compose up -d
          for i in $(seq 1 60); do curl -fs http://localhost:8080/ready && break; sleep 2; done
          curl -fs http://localhost:8080/ready
          curl -fs -X POST http://localhost:8080/api/chat -H 'Content-Type: application/json' \
            -d '{"message":"Prepare an incident for the highest-priority active alarm in EastRefinery."}' | python -c "import json,sys; r=json.load(sys.stdin); assert r['ticket_draft'], r; print(r['status'])"
      - if: always()
        run: docker compose logs --no-color | tail -200
